            viernes: [

                { nombre: 'Santo Entierro', sede: 'Iglesia Conventual de Nuestra Señora del Carmen', salida: '18:45', entradaCO: '20:45', salidaCO: '21:50', recogida: '23:40', itinerario: 'Real, Dolores, Pérez Galdós, Capataz Nicolás Carrillo, Plaza de la Iglesia, Real, CARRERA OFICIAL, General Valdés, Alameda Moreno de Guerra, Real, Galiano, San Joaquín, Plaza del Carmen, Real y a su Templo.' },
                { nombre: 'Rosario', sede: 'Iglesia Mayor Parroquial', salida: '23:00', entradaCO: '23:05', salidaCO: '23:45', recogida: '02:35', itinerario: 'Plaza de la Iglesia, CARRERA OFICIAL, General Valdés, Sánchez Cerquero, Daoiz, Isaac Peral, Arenal, Anden del Parque Almirante Laulhé, General García de La Herrán, Puerto de Palos, Pintor Ángel Cousilla, Moguer, Escritor Manuel Barrios, Paseo Virgen del Buen Fin, Parque Almirante Laulhé, Hermanos Laulhé, Antonio López, 24 de Septiembre de 1810, Rosario, Plaza de la Iglesia, y a su Templo.' }
            ],
            resurreccion: [
                { nombre: 'Resurrección', sede: 'Iglesia de San José Artesano', salida: '10:00', entradaCO: '11:45', salidaCO: '13:20', recogida: '14:45', itinerario: 'General García de la Herrán, Antonio López, González Hontoria, Rosario, Plaza de la Iglesia, Estación de Penitencia en la Iglesia Mayor, Real, Carrera Oficial, Isaac Peral, Arenal, Interior Parque Almirante Laulhé, Paseo Virgen del Buen Fin, Interior Parque Almirante Laulhé, General García de la Herrán y a su Templo.' }
            ]
        };

        let progresoInterval;

        const diasOffset = {
            domingo: 0,
            lunes: 1,
            martes: 2,
            miercoles: 3,
            jueves: 4,
            madrugada: 5,
            viernes: 5,
            resurreccion: 7
        };

        function obtenerTimestampAbsoluto(dia, horaString) {
            let offset = diasOffset[dia];
            let partes = horaString.split(':');
            let horas = parseInt(partes[0], 10);
            let minutos = parseInt(partes[1], 10);

            if (dia !== 'madrugada' && horas < 7) {
                offset += 1;
            }

            const fecha = new Date(2026, 2, 29 + offset, horas, minutos, 0);
            return fecha.getTime();
        }

        function actualizarProgresoLive(barras) {
            const ahora = Date.now();

            barras.forEach(barra => {
                const inicio = barra.inicioTs;
                const fin = barra.finTs;

                let porcentaje = 0;
                
                if (ahora >= fin) {
                    porcentaje = 100;
                    barra.boton.classList.add('opacity-40', 'grayscale');
                } else {
                    barra.boton.classList.remove('opacity-40', 'grayscale');
                    if (ahora > inicio) {
                        porcentaje = ((ahora - inicio) / (fin - inicio)) * 100;
                    }
                }

                barra.elemento.style.width = porcentaje + '%';
            });
        }

        function cargarDia() {
            const diaSelect = document.getElementById('diaSelect').value;
            const contenedor = document.getElementById('listaCofradias');
            contenedor.innerHTML = '';

            if (progresoInterval) {
                clearInterval(progresoInterval);
            }

            const cofradiasDia = datosSemanaSanta[diaSelect] || [];

            if (cofradiasDia.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-gray-500 py-8">No hay información para este día.</p>';
                return;
            }

            const cofradiasOrdenadas = cofradiasDia
                .map((cofradia, index) => ({ cofradia, index }))
                .sort((a, b) => {
                    const getMinutosSort = (horaStr) => {
                        let partes = horaStr.split(':');
                        let horas = parseInt(partes[0], 10);
                        let mins = parseInt(partes[1], 10);
                        if (horas < 7) horas += 24;
                        return horas * 60 + mins;
                    };
                    return getMinutosSort(a.cofradia.entradaCO) - getMinutosSort(b.cofradia.entradaCO);
                });

            const barrasParaActualizar = [];

            cofradiasOrdenadas.forEach((item) => {
                const cofradia = item.cofradia;
                const originalIndex = item.index;

                const btn = document.createElement('button');
                btn.className = 'relative overflow-hidden fade-in w-full bg-white text-left rounded-2xl shadow-sm border border-gray-200 hover:shadow-md hover:border-rose-300 transition-all duration-200 active:scale-95 group';
                btn.onclick = () => mostrarDetalle(diaSelect, originalIndex);
                
                const barraFondo = document.createElement('div');
                barraFondo.className = 'absolute top-0 left-0 h-full bg-rose-100 transition-all duration-1000 ease-linear z-0';
                barraFondo.style.width = '0%';
                
                const contenidoDiv = document.createElement('div');
                contenidoDiv.className = 'relative z-10 flex justify-between items-center p-5 w-full';

                const textoDiv = document.createElement('div');
                textoDiv.className = 'flex flex-col';
                
                const nombreEl = document.createElement('span');
                nombreEl.className = 'text-xl font-bold text-rose-900 mb-1';
                nombreEl.innerText = cofradia.nombre;
                
                const horarioEl = document.createElement('span');
                horarioEl.className = 'text-sm text-gray-500 font-medium';
                horarioEl.innerText = `Carrera Oficial: ${cofradia.entradaCO}`;
                
                textoDiv.appendChild(nombreEl);
                textoDiv.appendChild(horarioEl);
                
                const iconoFlecha = document.createElement('div');
                iconoFlecha.className = 'text-rose-400 group-hover:text-rose-600 transition-colors';
                iconoFlecha.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';

                contenidoDiv.appendChild(textoDiv);
                contenidoDiv.appendChild(iconoFlecha);
                
                btn.appendChild(barraFondo);
                btn.appendChild(contenidoDiv);
                contenedor.appendChild(btn);
                
                barrasParaActualizar.push({
                    boton: btn,
                    elemento: barraFondo,
                    inicioTs: obtenerTimestampAbsoluto(diaSelect, cofradia.entradaCO),
                    finTs: obtenerTimestampAbsoluto(diaSelect, cofradia.salidaCO)
                });
            });
            
            document.getElementById('mainContainer').scrollTop = 0;
            
            actualizarProgresoLive(barrasParaActualizar);
            progresoInterval = setInterval(() => actualizarProgresoLive(barrasParaActualizar), 60000);
        }

        function mostrarDetalle(dia, index) {
            const cofradia = datosSemanaSanta[dia][index];
            
            document.getElementById('modalTitulo').innerText = cofradia.nombre;
            document.getElementById('modalSede').innerText = cofradia.sede;
            document.getElementById('modalSalida').innerText = cofradia.salida;
            document.getElementById('modalRecogida').innerText = cofradia.recogida;
            document.getElementById('modalEntradaCO').innerText = cofradia.entradaCO;
            document.getElementById('modalSalidaCO').innerText = cofradia.salidaCO;
            document.getElementById('modalItinerario').innerText = cofradia.itinerario;
            
            const modal = document.getElementById('detalleModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex', 'fade-in');
        }

        function cerrarDetalle() {
            const modal = document.getElementById('detalleModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex', 'fade-in');
        }

        function abrirFb() {
            const modal = document.getElementById('fbModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex', 'fade-in');
        }

        function cerrarFb() {
            const modal = document.getElementById('fbModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex', 'fade-in');
        }

        /* --- LOGICA DEL JUEGO DEL IMPOSTOR --- */
        
        const diccionarioCofrade = [
            "Carrera Oficial", "Capirote", "Incienso", "Cargador", "Capataz", 
            "Trabajadera", "Marcha procesional", "Iglesia Mayor", "La Isla", 
            "Torrija", "Mantilla", "Nazareno", "Cruz de Guía", "Paso de palio", 
            "Paso de misterio", "Saeta", "Candelabro", "Faja", "Costal", 
            "Llamador", "Banda de música", "Penitente", "Bambalina", "Tortillita de camarones",
            "IslaPasión", "La Venera", "Calle Real", "Carga isleña", "Almohada", 
            "Palo", "Aguaor", "Cirial", "Pértiga", "Inciensario", "Naveta", 
            "Bocina", "Estandarte", "Senatus", "Libro de Reglas", "Simpecado", 
            "Canastilla", "Respiradero", "Faldón", "Varal", "Manto", "Corona", 
            "Potencias", "Túnica", "Cíngulo", "Cirio", "Hachón", "Hermano Mayor", 
            "Pregón", "Vía Crucis", "Diputado de tramo", "Calle Ancha", 
            "Plaza de la Pastora", "Siete Revueltas", "Callejón de Ánimas", 
            "Iglesia del Carmen", "Virgen del Carmen", "Rosario", "Campana"
        ];

        let impJugadores = [];
        let impImpostorIndex = -1;
        let impPalabraSecreta = '';
        let impTurnoActual = 0;

        function abrirImpostor() {
            const modal = document.getElementById('impostorModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex', 'fade-in');
            renderImpostorSetup();
        }

        function cerrarImpostor() {
            const modal = document.getElementById('impostorModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex', 'fade-in');
        }

        function generarInputsNombres() {
            const num = parseInt(document.getElementById('numJugadores').value);
            const contenedorNombres = document.getElementById('contenedorNombres');
            contenedorNombres.innerHTML = '';
            
            for (let i = 1; i <= num; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'w-full bg-gray-700 text-white border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-rose-500';
                input.placeholder = `Nombre del jugador ${i}`;
                input.id = `nombreJugador${i}`;
                contenedorNombres.appendChild(input);
            }
        }

        function renderImpostorSetup() {
            const contenedor = document.getElementById('impostorContenido');
            contenedor.innerHTML = `
                <div class="w-full max-w-sm flex flex-col gap-6 fade-in text-center">
                    <p class="text-gray-300">Descubre quién es el infiltrado en la cofradía. Todos verán una palabra secreta excepto el impostor.</p>
                    
                    <div class="flex flex-col gap-2 text-left">
                        <label class="text-sm font-bold text-gray-400 uppercase tracking-wider">Número de jugadores</label>
                        <select id="numJugadores" onchange="generarInputsNombres()" class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg p-3 focus:outline-none">
                            <option value="3">3 Jugadores</option>
                            <option value="4" selected>4 Jugadores</option>
                            <option value="5">5 Jugadores</option>
                            <option value="6">6 Jugadores</option>
                            <option value="7">7 Jugadores</option>
                            <option value="8">8 Jugadores</option>
                        </select>
                    </div>

                    <div id="contenedorNombres" class="flex flex-col gap-3">
                        <!-- Inputs generados aquí -->
                    </div>

                    <button onclick="iniciarJuegoImpostor()" class="w-full bg-rose-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-rose-500 transition active:scale-95 text-lg mt-2">
                        Comenzar Partida
                    </button>
                </div>
            `;
            generarInputsNombres();
        }

        function iniciarJuegoImpostor() {
            const num = parseInt(document.getElementById('numJugadores').value);
            impJugadores = [];
            
            for (let i = 1; i <= num; i++) {
                const nombre = document.getElementById(`nombreJugador${i}`).value.trim() || `Jugador ${i}`;
                impJugadores.push(nombre);
            }

            impImpostorIndex = Math.floor(Math.random() * impJugadores.length);
            impPalabraSecreta = diccionarioCofrade[Math.floor(Math.random() * diccionarioCofrade.length)];
            impTurnoActual = 0;

            mostrarTurnoPass();
        }

        function mostrarTurnoPass() {
            const contenedor = document.getElementById('impostorContenido');
            const nombreActual = impJugadores[impTurnoActual];

            contenedor.innerHTML = `
                <div class="w-full max-w-sm flex flex-col items-center gap-8 fade-in text-center">
                    <svg class="w-20 h-20 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    
                    <div>
                        <p class="text-xl text-gray-400 mb-2">Pasa el dispositivo a</p>
                        <h3 class="text-4xl font-bold text-white text-rose-500">${nombreActual}</h3>
                    </div>

                    <button onclick="revelarRol()" class="w-full bg-gray-700 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-gray-600 transition active:scale-95 text-lg">
                        Soy ${nombreActual}, ver mi rol
                    </button>
                </div>
            `;
        }

        function revelarRol() {
            const contenedor = document.getElementById('impostorContenido');
            const esImpostor = (impTurnoActual === impImpostorIndex);

            let contenidoRol = '';
            if (esImpostor) {
                contenidoRol = `
                    <p class="text-2xl font-bold text-red-500 mb-2">¡ERES EL IMPOSTOR!</p>
                    <p class="text-gray-300">Intenta disimular y adivinar la palabra por el contexto de los demás.</p>
                `;
            } else {
                contenidoRol = `
                    <p class="text-gray-400 uppercase tracking-widest text-sm mb-1">Palabra Secreta</p>
                    <p class="text-4xl font-bold text-white mb-2">${impPalabraSecreta}</p>
                    <p class="text-gray-400">Mantén la palabra en secreto.</p>
                `;
            }

            contenedor.innerHTML = `
                <div class="w-full max-w-sm flex flex-col items-center gap-8 fade-in text-center">
                    <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 w-full shadow-inner">
                        ${contenidoRol}
                    </div>

                    <button onclick="siguienteTurno()" class="w-full bg-rose-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-rose-500 transition active:scale-95 text-lg">
                        Ocultar y continuar
                    </button>
                </div>
            `;
        }

        function siguienteTurno() {
            impTurnoActual++;
            if (impTurnoActual < impJugadores.length) {
                mostrarTurnoPass();
            } else {
                mostrarFinPreparacion();
            }
        }

        function mostrarFinPreparacion() {
            const contenedor = document.getElementById('impostorContenido');
            
            contenedor.innerHTML = `
                <div class="w-full max-w-sm flex flex-col items-center gap-6 fade-in text-center">
                    <svg class="w-24 h-24 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
                    
                    <div>
                        <h3 class="text-3xl font-bold text-white mb-3">Todos listos</h3>
                        <p class="text-gray-300">Todos conocen su rol. Que empiece el debate para encontrar al impostor de la cofradía.</p>
                    </div>

                    <button onclick="revelarImpostorFinal()" class="w-full bg-amber-500 text-gray-900 font-bold py-4 rounded-xl shadow-lg hover:bg-amber-400 transition active:scale-95 text-lg mt-4">
                        Revelar Impostor
                    </button>

                    <div class="w-full flex gap-3 mt-2">
                        <button onclick="cerrarImpostor()" class="flex-1 bg-gray-700 text-white font-bold py-3 rounded-xl hover:bg-gray-600 transition active:scale-95">
                            Cerrar
                        </button>
                        <button onclick="renderImpostorSetup()" class="flex-1 bg-rose-600 text-white font-bold py-3 rounded-xl hover:bg-rose-500 transition active:scale-95">
                            Nueva Partida
                        </button>
                    </div>
                </div>
            `;
        }

        function revelarImpostorFinal() {
            const contenedor = document.getElementById('impostorContenido');
            const nombreImpostor = impJugadores[impImpostorIndex];
            
            contenedor.innerHTML = `
                <div class="w-full max-w-sm flex flex-col items-center gap-8 fade-in text-center">
                    <div class="bg-gray-800 p-8 rounded-2xl border border-rose-700 w-full shadow-inner">
                        <p class="text-gray-400 uppercase tracking-widest text-sm mb-1">El impostor era...</p>
                        <p class="text-4xl font-bold text-rose-500 mb-6">${nombreImpostor}</p>
                        
                        <p class="text-gray-400 uppercase tracking-widest text-sm mb-1 border-t border-gray-700 pt-6">La palabra secreta era</p>
                        <p class="text-2xl font-bold text-white mb-2">${impPalabraSecreta}</p>
                    </div>

                    <div class="w-full flex gap-3">
                        <button onclick="cerrarImpostor()" class="flex-1 bg-gray-700 text-white font-bold py-3 rounded-xl hover:bg-gray-600 transition active:scale-95">
                            Cerrar
                        </button>
                        <button onclick="renderImpostorSetup()" class="flex-1 bg-rose-600 text-white font-bold py-3 rounded-xl hover:bg-rose-500 transition active:scale-95">
                            Nueva Partida
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            document.getElementById('diaSelect').value = 'domingo';
            cargarDia();
        };
    </script>
